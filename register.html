cat > public/register.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smart Parking</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div style="max-width:400px;margin:80px auto;padding:30px;border:1px solid #ddd;border-radius:12px;">
        <h2>Smart Parking</h2>
        <h3>Create Your Account</h3>

        <form id="registerForm">
            <input type="text" placeholder="Full name" required
                   style="width:100%;padding:12px;margin:10px 0;box-sizing:border-box;">
            <input type="email" placeholder="Email address" required
                   style="width:100%;padding:12px;margin:10px 0;box-sizing:border-box;">
            <input type="password" placeholder="Password (minimum 8 characters)"
                   minlength="8" required
                   style="width:100%;padding:12px;margin:10px 0;box-sizing:border-box;">
            <button type="submit" style="width:100%;padding:12px;cursor:pointer;">
                Register
            </button>
        </form>

        <p>Already registered? <a href="/login.html">Login here</a></p>
        <a href="/">Back to Home</a>
        <p id="message"></p>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            document.getElementById("message").textContent =
                "Registration page is working. Backend registration is not connected yet.";
        });
    </script>
</body>
</html>
EOF
